{% extends 'industry_reforged/base.html' %}

{% load i18n %}
{% load humanize %}

{% block details %}
    <div class="row mb-4">
        <div class="col-12">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item active" aria-current="page">{% translate "Dashboard" %}</li>
                </ol>
            </nav>
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="mb-0">{% translate "Dashboard" %}</h2>
            </div>
        </div>
    </div>

    <div class="card border-0 mb-4 h-100">
        <div class="card-header p-0 border-bottom-0">

        <div class="card-body p-4">
            {{ text }}
        </div>
    </div>
{% endblock %}

{% endblock %}

{% endblock %}
