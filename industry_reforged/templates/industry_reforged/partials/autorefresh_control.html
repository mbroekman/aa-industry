{% load i18n %}
<div class="d-inline-flex align-items-center ms-2" id="autorefresh-container">
    <div class="dropdown">
        <button class="btn btn-outline-info btn-sm dropdown-toggle d-flex align-items-center shadow-sm" type="button" id="autoRefreshDropdown" data-bs-toggle="dropdown" aria-expanded="false" title="{% translate 'Page Auto-refresh' %}">
            <i class="fas fa-sync-alt me-1.5" id="auto-refresh-icon"></i>
            <span id="auto-refresh-label" class="fw-semibold">{% translate "Auto-refresh: Off" %}</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow border-secondary" aria-labelledby="autoRefreshDropdown">
            <li><h6 class="dropdown-header text-info"><i class="fas fa-clock me-1"></i> {% translate "Auto-refresh Interval" %}</h6></li>
            <li><button class="dropdown-item active d-flex justify-content-between align-items-center" type="button" data-interval="0"><span><i class="fas fa-ban text-muted me-2"></i>{% translate "Off" %}</span></button></li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item d-flex justify-content-between align-items-center" type="button" data-interval="300"><span><i class="far fa-clock text-info me-2"></i>{% translate "5 minutes" %}</span></button></li>
            <li><button class="dropdown-item d-flex justify-content-between align-items-center" type="button" data-interval="600"><span><i class="far fa-clock text-info me-2"></i>{% translate "10 minutes" %}</span></button></li>
            <li><button class="dropdown-item d-flex justify-content-between align-items-center" type="button" data-interval="900"><span><i class="far fa-clock text-info me-2"></i>{% translate "15 minutes" %}</span></button></li>
            <li><button class="dropdown-item d-flex justify-content-between align-items-center" type="button" data-interval="1500"><span><i class="far fa-clock text-info me-2"></i>{% translate "25 minutes" %}</span></button></li>
            <li><button class="dropdown-item d-flex justify-content-between align-items-center" type="button" data-interval="1800"><span><i class="far fa-clock text-info me-2"></i>{% translate "30 minutes" %}</span></button></li>
        </ul>
    </div>
</div>

<script>
(function() {
    const STORAGE_KEY = 'industry_autorefresh_interval_' + window.location.pathname.replace(/\/+$/, '');
    let intervalSeconds = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
    let timeoutId = null;

    const btnEl = document.getElementById('autoRefreshDropdown');
    const labelEl = document.getElementById('auto-refresh-label');
    const iconEl = document.getElementById('auto-refresh-icon');
    const items = document.querySelectorAll('#autorefresh-container .dropdown-item');

    function updateUI() {
        items.forEach(item => {
            const itemVal = parseInt(item.getAttribute('data-interval'), 10);
            if (itemVal === intervalSeconds) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });

        if (intervalSeconds === 0) {
            btnEl.classList.remove('btn-success', 'text-white');
            btnEl.classList.add('btn-outline-info');
            labelEl.textContent = '{% translate "Auto-refresh: Off" %}';
            iconEl.classList.remove('fa-spin');
        } else {
            const mins = Math.floor(intervalSeconds / 60);
            btnEl.classList.remove('btn-outline-info');
            btnEl.classList.add('btn-success', 'text-white');
            labelEl.textContent = `Auto-refresh: ${mins}m`;
        }
    }

    function doReload() {
        // Check if any modal is currently open
        const hasOpenModal = document.querySelector('.modal.show') !== null;
        if (hasOpenModal) {
            // Postpone reload by 5 seconds if modal is open
            timeoutId = setTimeout(doReload, 5000);
            return;
        }

        // Save tab state if any
        const activeTab = document.querySelector('.nav-tabs .nav-link.active, .nav-pills .nav-link.active');
        if (activeTab && activeTab.id) {
            sessionStorage.setItem('industry_active_tab', activeTab.id);
        }
        window.location.reload();
    }

    function setIntervalVal(val) {
        intervalSeconds = val;
        localStorage.setItem(STORAGE_KEY, val);
        updateUI();

        if (timeoutId) {
            clearTimeout(timeoutId);
            timeoutId = null;
        }

        if (intervalSeconds > 0) {
            timeoutId = setTimeout(doReload, intervalSeconds * 1000);
        }
    }

    items.forEach(item => {
        item.addEventListener('click', function(e) {
            e.preventDefault();
            const val = parseInt(this.getAttribute('data-interval'), 10);
            setIntervalVal(val);
        });
    });

    // Restore active tab after reload if stored
    const storedTab = sessionStorage.getItem('industry_active_tab');
    if (storedTab) {
        const tabTrigger = document.getElementById(storedTab);
        if (tabTrigger && typeof bootstrap !== 'undefined' && bootstrap.Tab) {
            const tabInstance = bootstrap.Tab.getOrCreateInstance(tabTrigger);
            tabInstance.show();
        }
        sessionStorage.removeItem('industry_active_tab');
    }

    // Initialize
    setIntervalVal(intervalSeconds);
})();
</script>
