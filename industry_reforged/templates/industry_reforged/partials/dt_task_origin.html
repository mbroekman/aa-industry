{% load i18n %}

{% if task.origin == "BASKET" %}
<span class="badge bg-info text-dark" title="{% trans 'AI Market Manager' %}"><i class="fas fa-robot"></i> AI Basket</span>
{% elif task.origin == "MEMBER_ORDER" %}
{% with order=task.created_from_order.root_order %}<span class="badge bg-primary" title="{% if order %}{% blocktrans with id=order.id %}Member Order #{{ id }}{% endblocktrans %}{% else %}{% trans 'Member Order' %}{% endif %}"><i class="fas fa-shopping-cart"></i> Order</span>{% endwith %}
{% elif task.origin == "BOM" %}
<span class="badge bg-secondary" title="{% trans 'BOM Component' %}"><i class="fas fa-cogs"></i> Component</span>
{% elif task.origin == "BLUEPRINT" %}
<span class="badge bg-warning text-dark" title="{% trans 'Blueprint Request' %}"><i class="fas fa-copy"></i> Blueprint</span>
{% else %}
<span class="badge bg-secondary" title="{% trans 'Manual' %}"><i class="fas fa-user-edit"></i> Manual</span>
{% endif %}
